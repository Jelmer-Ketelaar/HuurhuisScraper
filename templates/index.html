<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuurhuisScraper Zoekopdracht</title>
</head>
<body>
<h1>HuurhuisScraper Zoekopdracht</h1>
<form method="POST" action="/">
    <label for="city">Stad:</label>
    <input type="text" name="city" id="city" placeholder="Bijv. Amsterdam" required>

    <label for="rent_min">Minimum Huurprijs:</label>
    <input type="number" name="rent_min" id="rent_min" placeholder="Bijv. 500" required>

    <label for="rent_max">Maximum Huurprijs:</label>
    <input type="number" name="rent_max" id="rent_max" placeholder="Bijv. 1500" required>

    <button type="submit">Zoeken</button>
</form>
</body>
</html>
